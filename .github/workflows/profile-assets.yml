name: Update Contribution Signal

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/update_signal.py"
      - ".github/workflows/profile-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-signal
  cancel-in-progress: false

jobs:
  update-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate contribution artwork
        run: python3 scripts/update_signal.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_OWNER: ${{ github.repository_owner }}
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/signal.svg profile/signal-mobile.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh contribution signal"
          git pull --rebase origin main
          git push
