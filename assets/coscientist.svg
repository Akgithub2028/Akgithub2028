<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img"><title>Autonomous AI Co-Scientist</title><rect width="1200" height="260" rx="14" fill="#080c16"/><line x1="1" y1="18" x2="1" y2="252" stroke="#df79ff" stroke-width="3"/><text x="32" y="37" fill="#df79ff" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="400" >05 / AI FOR SCIENCE / PROJECT NOVA</text><text x="1165" y="39" fill="#df79ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" text-anchor="end">↗</text><text x="32" y="88" fill="#edf4ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="31" font-weight="700" >Autonomous AI Co-Scientist</text><text x="32" y="124" fill="#a0b2ca" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" >From literature to hypotheses, critique and iterative refinement.</text><text x="32" y="165" fill="#df79ff" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="400" >LANGGRAPH / CORRECTIVE RAG / VECTOR MEMORY / DOCKER</text><line x1="32" y1="194" x2="1168" y2="194" stroke="#27364d" stroke-width="1"/><text x="32" y="233" fill="#a0b2ca" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" >Literature → generate → reflect → rank → evolve → research report</text><line x1="718" y1="60" x2="718" y2="169" stroke="#27364d" stroke-width="1"/><text x="753" y="104" fill="#df79ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700" >Elo</text><text x="753" y="139" fill="#a0b2ca" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" >hypothesis ranking</text><text x="978" y="104" fill="#df79ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700" >CRAG</text><text x="978" y="139" fill="#a0b2ca" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" >evidence retrieval</text></svg>
